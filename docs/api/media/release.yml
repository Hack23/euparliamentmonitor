name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (vX.Y.Z format)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Is this a pre-release?"
        type: boolean
        default: false

# A release creates its own tag. Do not also trigger on tag pushes: GitHub App
# tokens emit push events, which would recursively start a duplicate release.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Restrict top-level permissions to minimum required defaults
permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). Build + E2E + docs generation;
    # <40 min typical. 60 min bounds runaway Playwright + doc retries.
    timeout-minutes: 60
    # Only prepare job needs write permissions for commit and tagging
    permissions:
      contents: write # Required for git auto-commit
    # Pre-baked Playwright image — runs E2E + doc generation without paying the
    # ~170 MB browser download or `playwright install-deps` apt-get cost.
    # NOTE: harden-runner is incompatible with container jobs; the egress-audit
    # observability is intentionally traded for build reliability here.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      npm_version: ${{ steps.get-version.outputs.npm_version }}
      is_prerelease: ${{ inputs.prerelease }}
    steps:
      - name: Configure git safe.directory
        # This step runs BEFORE actions/checkout. The container runs as root,
        # but actions/checkout writes the workspace as a different uid, so any
        # later `git` invocation in this job (auto-commit, tagging) would
        # otherwise fail with "detected dubious ownership". Marking the path
        # safe here — before checkout — means the very first git operation
        # (checkout itself, then everything after) can read/write the repo
        # without complaint. Only needed in this workflow because release.yml
        # performs git commits and tagging beyond checkout; the other
        # containerized workflows (e2e.yml, test-and-report.yml) only checkout
        # and don't need it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"


      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          ref: main

      - name: Validate release version
        id: get-version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release version must use the vX.Y.Z Semantic Versioning format." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

          echo "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          # npm version without 'v' prefix
          NPM_VERSION="${RELEASE_TAG#v}"
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RELEASE_TAG}"
          echo "npm version: ${NPM_VERSION}"

      - name: Setup Node.js
        # `cache: 'npm'` lets actions/setup-node call actions/cache internally.
        # No separate actions/cache step for ~/.npm — that would be redundant.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Run linter
        run: npm run lint

      # NOTE: htmlhint is not re-run here. It is already gated on every PR
      # and on push-to-main by `test-and-report.yml` (`Validate generated
      # HTML` step). Re-running it on release added ~2 min wall-clock for
      # no extra signal — the HTML hasn't changed between merge-to-main
      # and tag.

      - name: Set Version for release
        env:
          RELEASE_TAG: ${{ steps.get-version.outputs.version }}
        run: |
          PLAIN_VERSION="${RELEASE_TAG#v}"
          npm version $PLAIN_VERSION --no-git-tag-version


      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate lint reports
        run: |
          echo "🔍 Generating ESLint reports..."
          mkdir -p builds/test-results
          npm run lint:report || true
          npm run lint:report:html || true

      # Minimal Playwright smoke at release time. The full E2E suite has
      # already been validated by `e2e.yml` and `test-and-report.yml` on
      # the merge to main — re-running it here added ~25 min wall-clock
      # without producing new signal. We keep one fast spec (homepage)
      # so that `docs/playwright-report/` is refreshed every release;
      # without this step, the report would freeze at whatever was last
      # committed because neither `e2e.yml` nor `test-and-report.yml`
      # commits `docs/**` to main — only this release job does (via the
      # `Commit documentation updates` step below). The published release
      # notes and docs index card link to this report as the canonical
      # E2E report.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright homepage smoke (refreshes docs/playwright-report)
        run: npx playwright test e2e/tests/homepage.spec.js

      - name: Clean old documentation
        run: |
          echo "🧹 Cleaning old documentation..."
          rm -rf docs/api docs/coverage docs/test-results docs/playwright-report

      - name: Generate API documentation
        run: |
          echo "📖 Generating API documentation..."
          npm run docs:api

      - name: Copy test reports to docs
        run: |
          echo "📋 Copying test reports..."
          npm run docs:copy-reports

      - name: Generate documentation index
        run: |
          echo "📚 Generating documentation index..."
          npm run docs:index

      - name: Verify documentation structure
        run: |
          echo "🔍 Verifying documentation structure..."
          
          # Check required directories exist
          for dir in docs/api docs/coverage docs/test-results docs/playwright-report; do
            if [ -d "$dir" ]; then
              echo "✅ $dir exists"
            else
              echo "❌ $dir missing"
              exit 1
            fi
          done
          
          # Check required files exist
          for file in docs/index.html docs/api/index.html docs/coverage/index.html docs/test-results/index.html docs/playwright-report/index.html; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

          # Check optional but expected report files
          for file in docs/test-results/results.json docs/test-results/junit.xml docs/test-results/eslint-report.html docs/test-results/eslint-report.json; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "⚠️  $file not found (optional)"
            fi
          done
          
          # Check vitest HTML report directory
          if [ -d "docs/test-results/html" ]; then
            echo "✅ docs/test-results/html exists (Vitest HTML report)"
          else
            echo "⚠️  docs/test-results/html not found (optional)"
          fi
          
          echo "✅ Documentation structure validated"

      - name: Commit, sign, and tag release
        env:
          RELEASE_TAG: ${{ steps.get-version.outputs.version }}
          RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
        run: |
          git config user.name "hack23-automation[bot]"
          git config user.email "304996498+hack23-automation[bot]@users.noreply.github.com"

          if [ -n "$RELEASE_SSH_SIGNING_KEY" ]; then
            signing_key="$RUNNER_TEMP/release-signing-key"
            umask 077
            printf '%s\n' "$RELEASE_SSH_SIGNING_KEY" > "$signing_key"
            git config gpg.format ssh
            git config user.signingkey "$signing_key"
            git config commit.gpgsign true
            git config tag.gpgsign true
          else
            echo "RELEASE_SSH_SIGNING_KEY is not configured; commits and tags will not be signed." >&2
          fi

          git add docs package.json package-lock.json
          git commit -m "chore(release): bump version to $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

  build:
    name: Build Release Package
    needs: [prepare]
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). SBOM + attestation generation;
    # <20 min typical. 30 min bounds runaway sigstore / attest retries.
    timeout-minutes: 30
    # Build job needs specific permissions for attestations
    permissions:
      contents: read
      id-token: write # Required for OIDC
      attestations: write # Required for SBOM and build attestations
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit


      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Generate sample news (if needed)
        run: |
          # Generate static content (sitemap, political-intelligence pages)
          echo "📰 Generating static content..."
          npm run prebuild || echo "Prebuild skipped"
          npm run generate-news-indexes || echo "Index generation skipped"

      - name: Create release artifacts
        run: |
          # Create the zip file from the repository
          mkdir -p release-artifacts
          
          # Include all necessary files including documentation
          zip -r release-artifacts/euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip \
            news/ \
            docs/ \
            scripts/ \
            styles.css \
            index-*.html \
            sitemap.xml \
            package.json \
            package-lock.json \
            README.md \
            LICENSE \
            -x "*.git*" "node_modules/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: release-artifacts/
          if-no-files-found: error

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        id: sbom
        with:
          format: spdx-json
          output-file: euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json
          artifact-name: euparliamentmonitor-${{ needs.prepare.outputs.version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        id: attest
        with:
          subject-path: release-artifacts/euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip

      - name: Copy artifact attestation for zip
        run: cp ${{ steps.attest.outputs.bundle-path }} euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip.intoto.jsonl

      - name: Generate SBOM attestation
        id: attestsbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip
          sbom-path: euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json

      - name: Copy SBOM attestation for zip
        run: cp ${{ steps.attestsbom.outputs.bundle-path }} euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json.intoto.jsonl

      - name: Upload security artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-artifacts
          path: |
            euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json
            euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip.intoto.jsonl
            euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json.intoto.jsonl
          if-no-files-found: error

  release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). gh release create + asset
    # upload; <10 min typical. 20 min bounds runaway upload retries.
    timeout-minutes: 20
    # Release job needs specific permissions to create GitHub releases
    permissions:
      contents: write # Required to create releases
      id-token: write # Required for OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: artifacts/build

      - name: Download security artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-artifacts
          path: artifacts/security

      - name: Draft Release Notes
        id: release-drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.version }}
          name: EU Parliament Monitor ${{ needs.prepare.outputs.version }}
          publish: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Create GitHub Release with all artifacts
      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.prepare.outputs.version }}
          name: EU Parliament Monitor ${{ needs.prepare.outputs.version }}
          body: |
            ${{ steps.release-drafter.outputs.body }}

            ## 📦 Release Artifacts

            - `euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip` - Full application package
            - `euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json` - SBOM (Software Bill of Materials)
            - `*.intoto.jsonl` - SLSA Build Provenance Attestations

            ## 📦 npm Package

            ```bash
            npm install euparliamentmonitor@${{ needs.prepare.outputs.npm_version }}
            ```

            Published with [npm provenance](https://docs.npmjs.com/generating-provenance-statements) for supply chain security.

            ## 📚 Documentation

            - [API Documentation](https://hack23.github.io/euparliamentmonitor/docs/api/)
            - [Test Coverage Report](https://hack23.github.io/euparliamentmonitor/docs/coverage/)
            - [E2E Test Report](https://hack23.github.io/euparliamentmonitor/docs/playwright-report/)
            - [Documentation Hub](https://hack23.github.io/euparliamentmonitor/docs/)

            ## 🔐 Security

            All artifacts include SLSA Build Provenance attestations and SBOM for supply chain security.
            Verify attestations using the GitHub CLI:

            ```bash
            gh attestation verify euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip -R Hack23/euparliamentmonitor
            ```
          generateReleaseNotes: false
          immutableCreate: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          artifacts: |
            artifacts/build/euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip
            artifacts/security/euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json
            artifacts/security/euparliamentmonitor-${{ needs.prepare.outputs.version }}.zip.intoto.jsonl
            artifacts/security/euparliamentmonitor-${{ needs.prepare.outputs.version }}.spdx.json.intoto.jsonl
          token: ${{ steps.app-token.outputs.token }}

      # ─── npm Publish ────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          ref: ${{ needs.prepare.outputs.version }}

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: |
          echo "📦 Package contents preview:"
          npm pack --dry-run
          echo ""
          echo "📋 Package entry point:"
          node --input-type=module -e "
            import { readFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
            console.log('main:', pkg.main);
            console.log('types:', pkg.types);
            console.log('exports:', JSON.stringify(pkg.exports, null, 2));
          "

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Verify npm package
        run: |
          echo "✅ Package published successfully!"
          echo "📦 Package: euparliamentmonitor@${{ needs.prepare.outputs.npm_version }}"
          echo "🔗 npm URL: https://www.npmjs.com/package/euparliamentmonitor"
          echo ""
          echo "To install:"
          echo "  npm install euparliamentmonitor@${{ needs.prepare.outputs.npm_version }}"
          echo ""
          echo "To verify provenance:"
          echo "  npm audit signatures"
