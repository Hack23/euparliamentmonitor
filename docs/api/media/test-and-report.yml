name: Test and Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Set default permissions to read-only
permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). npm ci + cache warming;
    # <5 min typical. 15 min bounds runaway npm registry retries.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        # `cache: 'npm'` lets actions/setup-node call actions/cache internally,
        # keyed on the package-lock.json hash. We do NOT add a separate
        # actions/cache step for ~/.npm — that is redundant with this one and
        # would produce two caches with the same content under different keys.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

  validation:
    name: Validate Code
    needs: prepare
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). Lint + format + typecheck;
    # <10 min typical. 30 min bounds runaway eslint/tsc retries.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # For posting comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        # `cache: 'npm'` lets actions/setup-node call actions/cache internally,
        # keyed on the package-lock.json hash. We do NOT add a separate
        # actions/cache step for ~/.npm — that is redundant with this one.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Check code formatting
        run: |
          echo "🔍 Checking code formatting..."
          npm run format:check

      - name: Run HTML validation
        run: |
          echo "🔍 Validating HTML files..."
          npm run htmlhint || echo "HTML validation completed with warnings"

      - name: Check TypeScript compilation
        run: |
          echo "🔍 Checking TypeScript compilation..."
          npm run build:check

      - name: Verify package.json scripts
        run: |
          echo "🔍 Verifying package.json scripts..."
          # Verify required scripts exist
          required_scripts="generate-article generate-news-indexes generate-sitemap htmlhint"
          for script in $required_scripts; do
            if node -p "require('./package.json').scripts['$script']" 2>/dev/null | grep -v "^undefined$" > /dev/null; then
              echo "✅ Script found: $script"
            else
              echo "❌ Missing script: $script"
              exit 1
            fi
          done

  functional-tests:
    name: Functional Tests
    needs: [prepare, validation]
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). Vitest + content generation;
    # <45 min typical. 60 min bounds runaway hangs.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: |
          echo "🧪 Running unit tests..."
          npm run test:unit

      - name: Run integration tests
        run: |
          echo "🔗 Running integration tests..."
          npm run test:integration

      - name: Generate test coverage report
        run: |
          echo "📊 Generating test coverage..."
          npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5.3.1
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-euparliamentmonitor
          fail_ci_if_error: false

      - name: Test news generation
        env:
          USE_EP_MCP: false
        run: |
          echo "📰 Testing static content generation..."
          npm run prebuild
          
          # Verify news articles exist (committed corpus)
          if [ -d "news" ] && [ "$(ls -A news/*.html 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ News articles present"
            echo "📊 Found $(ls -1 news/*.html 2>/dev/null | wc -l) articles"
          else
            echo "⚠️ No news articles found (this is okay for placeholder mode)"
          fi

      - name: Test index generation
        run: |
          echo "📋 Testing index generation..."
          npm run generate-news-indexes
          
          # Verify indexes were generated
          if ls index-*.html 1> /dev/null 2>&1; then
            echo "✅ Index pages generated successfully"
            echo "📊 Generated $(ls -1 index-*.html | wc -l) index pages"
            ls -1 index-*.html
          else
            echo "❌ No index pages generated"
            exit 1
          fi

      - name: Test sitemap generation
        run: |
          echo "🗺️ Testing sitemap generation..."
          npm run generate-sitemap
          
          # Verify sitemap was generated
          if [ -f "sitemap.xml" ]; then
            echo "✅ Sitemap generated successfully"
            echo "📊 Sitemap size: $(wc -c < sitemap.xml) bytes"
            echo "📊 URL count: $(grep -c '<url>' sitemap.xml || echo '0')"
          else
            echo "❌ Sitemap not generated"
            exit 1
          fi

      - name: Validate generated HTML
        run: |
          echo "🔍 Validating generated HTML..."
          npm run htmlhint || echo "HTML validation completed"

      # NOTE: WCAG 2.1 AA accessibility tests are covered by the full
      # `e2e.yml` workflow (which runs the entire Playwright suite, including
      # `accessibility.spec.js`, in parallel). Running it again here just
      # duplicates ~3-5 minutes of wall-clock per PR for the same coverage.
      # If you need to gate merges on accessibility specifically, prefer a
      # required-check on the `e2e.yml` workflow rather than re-running the
      # suite in this job.

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output
          path: |
            news/
            index-*.html
            sitemap.xml
          if-no-files-found: warn

  performance:
    name: Performance Testing
    needs: [prepare, validation]
    runs-on: ubuntu-24.04
    # Explicit job cap (default is 360 min). Lighthouse CI on key routes;
    # <15 min typical. 30 min bounds runaway browser hangs.
    timeout-minutes: 30
    # Lighthouse CI requires headless Chrome. Chromium is installed via
    # `npx playwright install` so we avoid the fragile MCR container pull.
    permissions:
      contents: read
    env:
      GENERATION_BUDGET_MS: 30000
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        # `cache: 'npm'` lets actions/setup-node call actions/cache internally,
        # keyed on the package-lock.json hash. We do NOT add a separate
        # actions/cache step for ~/.npm — that is redundant with this one.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: News generation benchmark
        env:
          USE_EP_MCP: false
        run: |
          echo "⏱️ Benchmarking static content generation time..."
          START=$(date +%s%N)
          npm run prebuild
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "Generation time: ${DURATION}ms"
          if [ $DURATION -gt $GENERATION_BUDGET_MS ]; then
            echo "::warning::Static content generation exceeded ${GENERATION_BUDGET_MS}ms budget (${DURATION}ms)"
          else
            echo "✅ Static content generation within ${GENERATION_BUDGET_MS}ms budget (${DURATION}ms)"
          fi

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Install Playwright Chromium
        # Lighthouse uses playwright-core's Chromium binary. Install it (and
        # its OS-level deps) inline to avoid depending on the MCR container pull.
        run: npx playwright install --with-deps chromium

      - name: Resolve Chrome path for Lighthouse
        # playwright-core.chromium.executablePath() returns the exact path to
        # the Chromium binary installed by `npx playwright install chromium`.
        # Using this avoids hard-coding a build-numbered subdirectory.
        # `shell: bash` is required so `set -o pipefail` is available.
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          if [ ! -x "$CHROME_PATH" ]; then
            echo "❌ Resolved CHROME_PATH is not executable: $CHROME_PATH" >&2
            exit 1
          fi
          echo "✅ Resolved Chrome: $CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        # Chrome flags for headless Chromium in CI:
        #   --no-sandbox            Avoids sandbox issues in headless CI environments.
        #   --headless=new          Use the new headless mode (LHCI default omits it).
        #   --disable-dev-shm-usage /dev/shm is 64 MB on GitHub-hosted runners; without
        #                           this flag the renderer crashes mid-navigation
        #                           (Target closed → NO_FCP), see GitHub Actions
        #                           run #25600946624 for the failure trace.
        #   --disable-gpu           No GPU in CI; suppresses noisy swiftshader fallbacks.
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: lhci autorun --collect.settings.chromeFlags="--no-sandbox --headless=new --disable-dev-shm-usage --disable-gpu"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: builds/test-results/lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14

  security-check:
    name: Security Check
    needs: prepare
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). npm audit + license check;
    # <5 min typical. 15 min bounds runaway audit DB retries.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        # `cache: 'npm'` lets actions/setup-node call actions/cache internally,
        # keyed on the package-lock.json hash. We do NOT add a separate
        # actions/cache step for ~/.npm — that is redundant with this one.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Check for vulnerabilities
        run: |
          echo "🔒 Checking for security vulnerabilities..."
          
          # Run npm audit and capture output + exit code
          AUDIT_EXIT_CODE=0
          npm audit --audit-level=moderate > audit-output.txt 2>&1 || AUDIT_EXIT_CODE=$?
          
          if [ $AUDIT_EXIT_CODE -eq 0 ]; then
            echo "✅ No vulnerabilities found"
            cat audit-output.txt
          else
            cat audit-output.txt
            
            # Check if failure was a transient network/registry error (not a vulnerability report)
            if grep -qE "audit endpoint returned an error|403 Forbidden|ENOTFOUND|ECONNREFUSED|ETIMEDOUT" audit-output.txt; then
              echo ""
              echo "⚠️ npm audit registry unavailable - skipping vulnerability check"
              echo "ℹ️  The npm registry audit endpoint was unreachable (transient network error)."
              echo "   Vulnerability scanning will be retried on the next run."
            else
              echo "⚠️ Vulnerabilities detected - checking against documented false positives..."
              
              # Known false positives / accepted-risk vulnerabilities (devDep-only,
              # static-site build — mermaid is a build-time dependency vendored to
              # js/vendor/mermaid/ and does not execute against attacker-controlled
              # data at runtime; ESLint ajv ReDoS is a separate ESLint-only issue).
              # Both vulnerabilities are documented in SECURITY.md as accepted risk.
              # GHSA-2g4f-4pwh-qvx6 — ajv ReDoS (ESLint, not user-facing)
              # GHSA-w5hq-g745-h8pq — uuid <14 buffer-bounds, transitive via mermaid devDep
              ALLOWED_GHSAS_RE='GHSA-2g4f-4pwh-qvx6|GHSA-w5hq-g745-h8pq'
              UNKNOWN_GHSAS=$(grep -oE 'GHSA-[a-z0-9-]+' audit-output.txt | sort -u | grep -vE "$ALLOWED_GHSAS_RE" || true)
              if [ -z "$UNKNOWN_GHSAS" ] && \
                 ! grep -q "high severity" audit-output.txt && \
                 ! grep -q "critical severity" audit-output.txt; then
                echo ""
                echo "ℹ️  All detected vulnerabilities are documented false positives:"
                echo "   - ajv ReDoS (GHSA-2g4f-4pwh-qvx6): ESLint-only, doesn't use \$data option"
                echo "   - uuid bounds (GHSA-w5hq-g745-h8pq): mermaid devDep, build-time only, static site"
                echo "   - Documented in SECURITY.md as accepted risk"
                echo ""
                echo "✅ Security check passed (only known false positives)"
              else
                echo ""
                echo "❌ Found NEW or HIGH/CRITICAL vulnerabilities not documented as false positives"
                if [ -n "$UNKNOWN_GHSAS" ]; then
                  echo "   Undocumented GHSAs found:"
                  echo "$UNKNOWN_GHSAS" | sed 's/^/     - /'
                fi
                echo "   Please review and update SECURITY.md if these are false positives"
                echo ""
                exit 1
              fi
            fi
          fi

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated dependencies..."
          npm outdated || echo "Dependency check completed"

  node-next:
    name: Node.js Nightly Compatibility
    # Informational-only canary — run on push (main) and scheduled runs, but
    # skip on PRs to keep the per-PR critical path lean. Failures don't gate
    # merges (continue-on-error: true) and rerunning on every PR provides no
    # extra signal.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    continue-on-error: true
    # Explicit job cap (default is 360 min). Lint + unit tests on nightly
    # Node; <15 min typical. 30 min bounds runaway nightly-Node regressions.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js nightly
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '27.0.0-nightly'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test

  report:
    name: Generate Report
    needs: [validation, functional-tests, security-check, performance, node-next]
    runs-on: ubuntu-26.04
    if: always()
    # Explicit job cap (default is 360 min). Aggregates artifacts + posts
    # PR comment; <5 min typical. 15 min bounds runaway upload retries.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-output
          path: test-artifacts/
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "# Test and Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "- Code validation: ${{ needs.validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Functional tests: ${{ needs.functional-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security check: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance testing: ${{ needs.performance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js 26 nightly (informational): ${{ needs.node-next.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- ♿ WCAG 2.1 AA accessibility tests run as part of functional-tests job" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [Accessibility report artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validation.result }}" == "success" ] && \
             [ "${{ needs.functional-tests.result }}" == "success" ] && \
             [ "${{ needs.security-check.result }}" == "success" ] && \
             [ "${{ needs.performance.result }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
