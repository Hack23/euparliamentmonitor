#
# News: Translate Reconciler
# ---------------------------
# Scans news/ for article slugs whose non-English language coverage is <14/14
# within a recent sliding window and dispatches backfill runs of the
# news-translate agentic workflow for each gap. Deterministic, cheap,
# and runs independently of the AI translate agent — prevents silent
# coverage gaps caused by safeoutputs session expiry in long translate runs
# (see PR #1254 / run 24616924067 root cause analysis).
#
# Schedule: hourly. Dispatches are capped per run to avoid storms.

name: "News: Translate Reconciler"

on:
  # ⚠️ DISABLED — the split-family translate-coverage gap that this
  # reconciler addressed no longer exists in the unified
  # news-<type>.md workflows (PR #1278, analysis-artifact-driven
  # pipeline). Translation now runs end-to-end inside a single
  # news-translate.md invocation per article. The file is retained
  # for a two-week regression window; final deletion happens in PR 7.
  # Manual dispatch only — schedule removed.
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Lookback window in days (how far back to scan for gaps)'
        required: false
        default: '10'
      max_dispatches:
        description: 'Maximum number of translate dispatches per reconciler run'
        required: false
        default: '3'
      dry_run:
        description: 'List gaps but do not dispatch'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write  # required to dispatch news-translate.lock.yml

concurrency:
  group: news-translate-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    name: Scan gaps and dispatch backfill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          sparse-checkout: |
            news
          sparse-checkout-cone-mode: false

      - name: Find coverage gaps
        id: gaps
        shell: bash
        run: |
          set -euo pipefail

          WINDOW_DAYS="${{ github.event.inputs.window_days || '10' }}"
          NON_EN="ar da de es fi fr he ja ko nl no sv zh"

          # Validate WINDOW_DAYS is a positive integer with sensible bounds (1..90).
          # Reject leading zeros to avoid decimal/octal ambiguity confusion downstream.
          if ! [[ "$WINDOW_DAYS" =~ ^[1-9][0-9]*$ ]] || [ "$WINDOW_DAYS" -lt 1 ] || [ "$WINDOW_DAYS" -gt 90 ]; then
            echo "❌ window_days must be an integer between 1 and 90, no leading zeros (got: '$WINDOW_DAYS')" >&2
            exit 2
          fi

          echo "📅 Scanning last ${WINDOW_DAYS} day(s) for incomplete language coverage..."

          # Build the set of dates in the window (YYYY-MM-DD, UTC).
          # seq 0..(WINDOW_DAYS-1) so WINDOW_DAYS=10 scans exactly 10 days (today + 9 prior).
          DATES=""
          LAST_OFFSET=$((WINDOW_DAYS - 1))
          for i in $(seq 0 "${LAST_OFFSET}"); do
            DATES="$DATES $(date -u -d "-${i} days" +%Y-%m-%d)"
          done

          GAPS_FILE="$RUNNER_TEMP/gaps.tsv"
          : > "$GAPS_FILE"

          for D in $DATES; do
            # Collect unique slugs for that date by iterating matching files directly
            # (avoids ls|grep, per shellcheck SC2010 — handles non-alphanumeric safely).
            SLUG_TMP="$RUNNER_TEMP/slugs.${D}.txt"
            : > "$SLUG_TMP"
            shopt -s nullglob
            for F in news/"${D}"-*-??.html; do
              BASENAME="${F#news/}"
              # Keep only files whose suffix matches one of the 14 expected language codes.
              case "$BASENAME" in
                *-ar.html|*-da.html|*-de.html|*-en.html|*-es.html|*-fi.html|*-fr.html|*-he.html|*-ja.html|*-ko.html|*-nl.html|*-no.html|*-sv.html|*-zh.html)
                  # Strip trailing -LL.html to get the slug.
                  echo "${BASENAME%-??.html}" >> "$SLUG_TMP"
                  ;;
              esac
            done
            shopt -u nullglob
            SLUGS=$(sort -u "$SLUG_TMP" || true)
            for SLUG in $SLUGS; do
              # Require an -en.html source to exist; otherwise skip (can't translate without source).
              if [ ! -f "news/${SLUG}-en.html" ]; then
                continue
              fi
              MISSING=""
              for LANG in $NON_EN; do
                if [ ! -f "news/${SLUG}-${LANG}.html" ]; then
                  MISSING="${MISSING}${MISSING:+,}${LANG}"
                fi
              done
              if [ -n "$MISSING" ]; then
                # Extract article_type from slug: DATE-TYPE[-runNN].  The news-translate
                # workflow accepts type slugs like week-in-review / committee-reports;
                # strip DATE- prefix and trailing -runNN if present.
                TYPE=$(echo "$SLUG" | sed -E "s/^${D}-//" | sed -E 's/-run[0-9]+$//')
                printf '%s\t%s\t%s\t%s\n' "$D" "$SLUG" "$TYPE" "$MISSING" >> "$GAPS_FILE"
              fi
            done
          done

          if [ ! -s "$GAPS_FILE" ]; then
            echo "✅ No coverage gaps in the last ${WINDOW_DAYS} days — nothing to dispatch."
            echo "gap_count=0" >> "$GITHUB_OUTPUT"
            echo "gaps_file=$GAPS_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prioritise: gaps with the most missing languages first (biggest wins),
          # then by most recent date.  Commas in col 4 count languages.
          SORTED="$RUNNER_TEMP/gaps.sorted.tsv"
          awk -F '\t' '{
            n=split($4, a, ","); print n "\t" $0
          }' "$GAPS_FILE" | sort -k1,1nr -k2,2r | cut -f2- > "$SORTED"

          GAP_COUNT=$(wc -l < "$SORTED" | tr -d ' ')
          echo "🔎 Found ${GAP_COUNT} article slug(s) with missing translations:"
          awk -F '\t' '{ printf "   %s  %s  (missing: %s)\n", $1, $2, $4 }' "$SORTED"

          echo "gap_count=${GAP_COUNT}" >> "$GITHUB_OUTPUT"
          echo "gaps_file=${SORTED}" >> "$GITHUB_OUTPUT"

      - name: Dispatch backfill runs
        if: steps.gaps.outputs.gap_count != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAPS_FILE: ${{ steps.gaps.outputs.gaps_file }}
          MAX_DISPATCHES: ${{ github.event.inputs.max_dispatches || '3' }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate MAX_DISPATCHES is a positive integer with sensible bounds (1..20).
          # Reject leading zeros to avoid decimal/octal ambiguity confusion downstream.
          if ! [[ "$MAX_DISPATCHES" =~ ^[1-9][0-9]*$ ]] || [ "$MAX_DISPATCHES" -lt 1 ] || [ "$MAX_DISPATCHES" -gt 20 ]; then
            echo "❌ max_dispatches must be an integer between 1 and 20, no leading zeros (got: '$MAX_DISPATCHES')" >&2
            exit 2
          fi

          DISPATCHED=0
          ATTEMPTED=0
          FAILED=0
          # The compiled workflow file name — this is the target of `gh workflow run`.
          WORKFLOW_FILE="news-translate.lock.yml"

          # Pre-aggregate the gaps: for each unique (date, type) pair, UNION the missing
          # language codes across ALL slugs that share that key. Without this, the
          # dedupe-by-(date,type) loop would dispatch using only the first slug's
          # MISSING list, leaving other slugs' gaps unaddressed for this run.
          AGG_FILE="$RUNNER_TEMP/gaps.agg.tsv"
          awk -F'\t' '
            {
              key = $1 "|" $3
              # Track the first-seen slug per key purely for log readability
              if (!(key in first_slug)) { first_slug[key] = $2 }
              date[key] = $1
              type[key] = $3
              n = split($4, langs, ",")
              for (i = 1; i <= n; i++) {
                lang = langs[i]
                if (lang != "" && !(key SUBSEP lang in seen)) {
                  seen[key SUBSEP lang] = 1
                  all_langs[key] = (all_langs[key] == "" ? lang : all_langs[key] "," lang)
                }
              }
            }
            END {
              for (key in all_langs) {
                # Deterministic output: sort the union alphabetically
                n = split(all_langs[key], arr, ",")
                for (i = 1; i <= n; i++) {
                  for (j = i + 1; j <= n; j++) {
                    if (arr[j] < arr[i]) { t = arr[i]; arr[i] = arr[j]; arr[j] = t }
                  }
                }
                sorted = arr[1]
                for (i = 2; i <= n; i++) sorted = sorted "," arr[i]
                print date[key] "\t" first_slug[key] "\t" type[key] "\t" sorted
              }
            }
          ' "$GAPS_FILE" | sort > "$AGG_FILE"

          # The aggregated file has one line per (date, type); dispatch in order,
          # capped at MAX_DISPATCHES.
          while IFS=$'\t' read -r D SLUG TYPE MISSING; do
            if [ -z "$D" ] || [ -z "$TYPE" ]; then
              continue
            fi

            if [ "$DISPATCHED" -ge "$MAX_DISPATCHES" ]; then
              echo "⏸️  Dispatch cap (${MAX_DISPATCHES}) reached — remaining gaps will be picked up on the next run."
              break
            fi

            echo "🚀 Dispatching news-translate for date=${D} type=${TYPE} (union of missing langs: ${MISSING}, first slug: ${SLUG})"
            ATTEMPTED=$((ATTEMPTED + 1))
            # --field passes a string input. We pass only the missing langs so the
            # translate agent focuses its time budget on what's actually needed.
            # Only count as dispatched on success — a masked failure would otherwise
            # prematurely hit the cap without actually starting any runs.
            if gh workflow run "$WORKFLOW_FILE" \
                --ref main \
                --field article_date="$D" \
                --field article_types="$TYPE" \
                --field languages="$MISSING" \
                --field force_translation=true; then
              DISPATCHED=$((DISPATCHED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "⚠️  Dispatch failed for ${D}/${TYPE} — continuing"
            fi
          done < "$AGG_FILE"

          echo "✅ Reconciler completed — ${DISPATCHED} successful dispatch(es), ${FAILED} failed, ${ATTEMPTED} attempted."

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## News: Translate Reconciler"
            echo ""
            echo "- Gaps found: \`${{ steps.gaps.outputs.gap_count || '0' }}\`"
            echo "- Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`"
            echo "- Max dispatches: \`${{ github.event.inputs.max_dispatches || '3' }}\`"
            echo "- Window (days): \`${{ github.event.inputs.window_days || '10' }}\`"
            if [ -f "${{ steps.gaps.outputs.gaps_file || '/dev/null' }}" ]; then
              echo ""
              echo "### Gaps"
              echo ""
              echo '| Date | Slug | Type | Missing languages |'
              echo '|------|------|------|--------------------|'
              awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }' \
                "${{ steps.gaps.outputs.gaps_file }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
