name: Knip — Unused Code Detection

# Knip scans for unused files, exports, dependencies, and types across src/**
# and the hand-written scripts in scripts/**. Runs on every PR and on pushes
# to main. Currently warning-only (continue-on-error: true) to keep the gate
# permissive while the baseline stabilises; flip to blocking once findings
# stay clean for two consecutive PR cycles.
#
# See WORKFLOWS.md § Knip / Unused Code Detection for the full contract.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: knip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Knip Scan
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). Knip is a TypeScript static
    # analyzer; <5 min typical. 15 min bounds runaway npm install retries.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript (so knip can resolve compiled scripts/**)
        run: npm run build

      - name: Run Knip
        id: knip
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run knip 2>&1 | tee knip-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## 🔍 Knip — Unused Code Report"
            echo ""
            if [ "${{ steps.knip.outputs.status }}" = "0" ]; then
              echo "✅ No unused code, exports, or dependencies detected."
            else
              echo "⚠️ Knip detected unused code (warning-only mode)."
              echo ""
              echo "<details><summary>Full report</summary>"
              echo ""
              echo '```'
              cat knip-output.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "_See [WORKFLOWS.md](${{ github.server_url }}/${{ github.repository }}/blob/main/WORKFLOWS.md) § Knip for triage guidance._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Knip report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knip-report
          path: knip-output.txt
          retention-days: 14
          if-no-files-found: ignore
