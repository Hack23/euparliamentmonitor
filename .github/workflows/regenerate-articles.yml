name: Regenerate Articles

# Deterministically regenerate every analysis-run article.md and the full
# 14-language news/*.html set by running `npm run generate-article:all`,
# then commit any changed files directly to the default branch.
#
# Pairs with the aggregator pipeline documented in Article-Generation.md.
# Modeled on .github/workflows/compile-agentic-workflows.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    name: Regenerate all article.md and HTML output
    runs-on: ubuntu-26.04
    # Explicit cap (default is 360 min). Regenerating every article spans
    # ~14 languages × dozens of dates; historic runs complete in <20 min.
    # 60 min bounds runaway and matches the news-* agentic cap.
    timeout-minutes: 60

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate all articles (article.md + 14-language HTML)
        run: npm run generate-article:all

      - name: Commit regenerated articles
        run: |
          # The aggregator writes:
          # - analysis/daily/<date>/<slug>/article.md
          # - analysis/daily/<date>/<slug>/article-meta.json
          # - news/<date>-<slug>.en.md          (English source Markdown)
          # - news/<date>-<slug>-<lang>.html    (14 language HTML variants)
          git add 'analysis/daily/**/article.md' \
                  'analysis/daily/**/article-meta.json' \
                  'news/*.md' \
                  'news/*.html'

          if git diff --cached --quiet; then
            echo "ℹ️ No regenerated article changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git diff --cached --stat
            git commit \
              -m "chore(articles): regenerate all article.md and 14-language HTML output" \
              -m "Deterministic rerun of \`npm run generate-article:all\` via the Regenerate Articles workflow. Refreshes every analysis-run article.md and every news/<date>-<slug>-<lang>.{md,html} variant from the committed analysis artifacts (no AI involvement)." \
              -m "Workflow: .github/workflows/regenerate-articles.yml" \
              -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
            echo "✅ Committed and pushed regenerated articles"
          fi
