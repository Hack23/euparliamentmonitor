name: Deploy to S3
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: write

env:
  AWS_REGION : "us-east-1"
  AWS_REGION_ZONE : "us-east-1"
  S3_BUCKET_NAME: "euparliamentmonitor-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "euparliamentmonitor-frontend"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            amazon-cloudfront-secure-static-site-s3bucketroot-14oliw5cmta06.s3.us-east-1.amazonaws.com:443
            api.github.com:443
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            euparliamentmonitor-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            s3.us-east-1.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            token.actions.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
          cache: 'npm'

      - name: Generate derived files (indexes, metadata, sitemap, political-intelligence)
        run: |
          npm ci
          # Vendor JS libraries (chart.js, d3, chartjs-plugin-annotation, mermaid)
          # MUST run BEFORE node_modules is removed and BEFORE S3 sync — the
          # static site loads every executable bundle from same-origin
          # `js/vendor/` (CSP `script-src 'self'`, no external CDN).
          npm run copy-vendor
          npm run prebuild
          rm -rf node_modules
          echo "✅ Generated index files, articles-metadata.json, sitemap.xml, sitemap_*.html, political-intelligence_*.html, and vendored JS bundles"

      - name: Normalise CSP and Mermaid cache-bust in legacy news articles
        run: |
          # Convert legacy per-article CSPs (with sha256 hashes or `default-src 'none'`)
          # to the current fixed policy: `script-src 'self'` with all executable
          # inline blocks externalised to js/article-runtime.js. Newly generated
          # articles already emit this CSP — this step only patches historical
          # articles committed before the template refactor.
          count=0
          for f in news/*.html; do
            if grep -q "default-src 'none'" "$f" 2>/dev/null; then
              sed -i \
                -e "s/default-src 'none'/default-src 'self'/g" \
                -e "s/connect-src 'none'/connect-src 'self'/g" \
                "$f"
              count=$((count + 1))
            fi
            # Collapse `script-src 'self' 'sha256-…' 'sha256-…' …;` → `script-src 'self';`
            if grep -qE "script-src 'self'( 'sha256-[^']+')+" "$f" 2>/dev/null; then
              sed -i -E "s/script-src 'self'( 'sha256-[^']+')+;/script-src 'self';/g" "$f"
              count=$((count + 1))
            fi
          done
          echo "✅ Normalised CSP in $count legacy article(s)"

          # Pin the Mermaid bundle cache-bust to the version declared in
          # package.json so a Mermaid devDependency bump invalidates browser
          # and CloudFront caches across ALL articles on the next deploy —
          # including legacy articles that aren't regenerated by the
          # aggregator pipeline. Reads the version with Node (no jq dep).
          MERMAID_VERSION=$(node -p "require('./package.json').devDependencies.mermaid.replace(/^[\^~><=]+/, '')")
          if [ -z "$MERMAID_VERSION" ]; then
            echo "⚠️  Could not resolve mermaid version from package.json"
          else
            echo "🔧 Pinning Mermaid cache-bust query to v$MERMAID_VERSION"
            mermaid_patched=0
            for f in news/*.html; do
              # Match any existing `mermaid-init.js` reference (with or without
              # an existing `?v=<x>` query) and rewrite it to the current
              # MERMAID_VERSION. Idempotent: re-running with the same version
              # leaves the file byte-identical.
              if grep -qE 'src="\.\./js/mermaid-init\.js(\?v=[0-9.]+)?"' "$f" 2>/dev/null; then
                sed -i -E "s|src=\"\.\./js/mermaid-init\.js(\\?v=[0-9.]+)?\"|src=\"../js/mermaid-init.js?v=${MERMAID_VERSION}\"|g" "$f"
                mermaid_patched=$((mermaid_patched + 1))
              fi
            done
            echo "✅ Pinned Mermaid cache-bust in $mermaid_patched article(s)"
          fi

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to S3 with cache headers
        run: |
          BUCKET="s3://${{ env.S3_BUCKET_NAME }}"
          SRC="."

          # Common exclusions for non-website directories/files (bash array)
          EXCL=(
            --exclude "screenshots/*"
            --exclude ".git/*"
            --exclude "scripts/*"
            --exclude "test/*"
            --exclude "e2e/*"
            --exclude "src/*"
            --exclude ".github/*"
            --exclude ".devcontainer/*"
            --exclude "node_modules/*"
            --exclude "quicksight/*"
            --exclude "schemas/*"
            --exclude "builds/*"
            --exclude "runbooks/*"
            --exclude "analysis/*"
            --exclude "*.md"
            --exclude "package*.json"
            --exclude ".gitignore"
            --exclude ".gitattributes"
            --exclude "tsconfig*.json"
            --exclude "typedoc.json"
            --exclude "jsdoc.json"
            --exclude "knip.json"
            --exclude "*.config.js"
            --exclude ".eslintcache"
            --exclude ".prettierrc.json"
            --exclude ".prettierignore"
            --exclude ".npmignore"
            --exclude ".lintstagedrc.json"
            --exclude ".jscpd.json"
            --exclude ".htmlhintignore"
            --exclude ".lighthouserc.json"
            --exclude ".lighthouserc.json.license"
            --exclude "*.patch"
            --exclude "*.lock"
            --exclude "*.tgz"
            --exclude "vitest.config.js"
            --exclude "playwright.config.js"
            --exclude "eslint.config.js"
            --exclude "tool-schemas.json"
            --exclude "*.template"
          )

          # ─── Pass 1: HTML files (short cache, ~1hr) ───────────────────────
          # --checksum instead of --size-only: HTML files are not fingerprinted
          # and small edits often don't change file size, so we need content
          # comparison to avoid serving stale pages after CloudFront invalidation.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-mode ENABLED \
            --no-progress \
            --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=3600, must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 1/6: HTML files synced"

          # ─── Pass 2: Static assets (long cache, ~1yr immutable) ────────────
          # --size-only is safe here: all assets are fingerprinted (vendor chunks
          # have content-hashed names, JS/CSS via mermaid cache-bust query param).
          # A size change always means a new asset file, so --size-only is correct.
          aws s3 sync "$SRC" "$BUCKET" \
            --size-only \
            --no-progress \
            --exclude '*' \
            --include '*.css' \
            --include '*.js' --include '*.mjs' \
            --include '*.js.map' --include '*.mjs.map' \
            --include '*.svg' \
            --include '*.webp' --include '*.png' --include '*.jpg' --include '*.jpeg' \
            --include '*.gif' --include '*.ico' \
            --include '*.woff' --include '*.woff2' --include '*.ttf' --include '*.eot' --include '*.otf' \
            --cache-control 'public, max-age=31536000, immutable' \
            "${EXCL[@]}"
          echo "✅ Pass 2/6: Static assets synced"

          # ─── Pass 3: JSON metadata (medium cache, ~24hr) ──────────────────
          # --checksum for correctness — articles-metadata.json and build-info.json
          # are regenerated every deploy; content may change without size change.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-mode ENABLED \
            --no-progress \
            --exclude '*' --include '*.json' \
            --cache-control 'public, max-age=86400' \
            --content-type 'application/json; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 3/6: JSON metadata synced"

          # ─── Pass 4: XML sitemaps/RSS (medium cache, ~24hr) ─────────────────
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-mode ENABLED \
            --no-progress \
            --exclude '*' --include '*.xml' \
            --cache-control 'public, max-age=86400' \
            --content-type 'text/xml; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 4/6: XML sitemaps synced"

          # ─── Pass 5: Plain text files (medium cache, ~24hr) ─────────────────
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-mode ENABLED \
            --no-progress \
            --exclude '*' \
            --include '*.txt' --include '.nojekyll' \
            --cache-control 'public, max-age=86400' \
            --content-type 'text/plain; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 5/6: Text files synced"

          # ─── Pass 6: Web app manifest (medium cache, ~24hr) ─────────────────
          # Separate pass to serve correct application/manifest+json content-type
          # required for PWA install prompts and browser manifest parsing.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-mode ENABLED \
            --no-progress \
            --exclude '*' --include '*.webmanifest' \
            --cache-control 'public, max-age=86400' \
            --content-type 'application/manifest+json' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 6/6: Web manifest synced"

          echo "✅ Deploy completed (6 sync passes)"
      
      # Invalidate CloudFront cache to ensure latest content is served
      # Note: Using blanket "/*" invalidation is optimal for this use case:
      # - Site has ~500 files (well within 1000 free invalidations/month)
      # - Deployment frequency is low (PR-based, not continuous)
      # - Simplicity trumps optimization at this scale
      # - Cache headers already optimized (1hr HTML, 1yr assets, 24hr metadata)
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
