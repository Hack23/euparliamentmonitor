name: Deploy to S3
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: write

env:
  AWS_REGION : "us-east-1"
  AWS_REGION_ZONE : "us-east-1"
  S3_BUCKET_NAME: "euparliamentmonitor-frontend-us-east-1-172017021075"
  CLOUDFRONT_STACK_NAME: "euparliamentmonitor-frontend"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: block
          allowed-endpoints: >
            amazon-cloudfront-secure-static-site-s3bucketroot-14oliw5cmta06.s3.us-east-1.amazonaws.com:443
            api.github.com:443
            cloudformation.us-east-1.amazonaws.com:443
            cloudfront.amazonaws.com:443
            euparliamentmonitor-frontend-us-east-1-172017021075.s3.us-east-1.amazonaws.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            s3.us-east-1.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            token.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Generate derived files (indexes, metadata, sitemap, political-intelligence)
        run: |
          # Vendor JS libraries (chart.js, d3, chartjs-plugin-annotation, mermaid)
          # MUST run BEFORE node_modules is removed and BEFORE S3 sync — the
          # static site loads every executable bundle from same-origin
          # `js/vendor/` (CSP `script-src 'self'`, no external CDN).
          npm run copy-vendor
          npm run prebuild
          echo "✅ Generated index files, articles-metadata.json, sitemap.xml, sitemap_*.html, political-intelligence_*.html, and vendored JS bundles"

      - name: Generate responsive image variants
        # Uses sharp (devDependency) to derive AVIF/WebP/JPEG banner and social
        # image variants from canonical PNG source artwork before deploy.
        # The generator is deterministic and cheap; the later image sync passes
        # use --size-only so unchanged byte-size variants are not re-uploaded.
        # GitHub Actions bash steps fail fast by default, so a generation error
        # stops deployment before CSS optimisation, minification, or S3 sync.
        run: npm run image:generate

      - name: Optimise CSS (drop unused selectors against every shipped HTML page)
        # Runs PurgeCSS via scripts/optimize-css.js — scans all *.html (root +
        # news/*.html + generated index*/sitemap*/political-intelligence_*.html),
        # plus js/**/*.js and scripts/templates|generators for class names that
        # only appear in JS string literals, then rewrites styles.css in place.
        # Filename is preserved so every existing
        # `<link rel="stylesheet" href="styles.css">` continues to resolve.
        # MUST run BEFORE `rm -rf node_modules` (purgecss is a devDependency)
        # and BEFORE the minify-assets step (so the minifier compresses
        # the already-purged stylesheet, not the bloated original).
        run: npm run optimize-css

      - name: Normalise CSP, Mermaid cache-bust, and responsive images in legacy news articles
        # Replaces the earlier inline `sed -i` loops, which always rewrote
        # every news/*.html file (~4400+) even when the substitution was a
        # no-op — bumping mtime and forcing the upload sync step below to
        # re-upload the entire news archive on every deploy.
        #
        # The Node helper at scripts/normalize-legacy-articles.js applies
        # the same CSP + Mermaid normalisations and also upgrades legacy
        # fixed-size banner/icon/social-image tags to the generated responsive
        # variants. It is idempotent at the byte level: files already normalised
        # are left untouched on disk so their mtime stays stable and the
        # size+mtime-based sync below correctly skips them on reruns.
        #
        # Filename / filepath contract preserved exactly:
        #   <script src="../js/mermaid-init.js?v=${MERMAID_VERSION}"></script>
        # Every existing reference resolves identically; only the `?v=…`
        # query changes when the pinned mermaid version itself changes.
        run: node scripts/normalize-legacy-articles.js

      - name: Minify HTML/CSS/JS
        # Pure-Node minification using html-minifier-terser, clean-css, and
        # terser (all devDependencies). Runs BEFORE `rm -rf node_modules`
        # because those packages are needed at minify time.
        #
        # Replaces the earlier Docker-based minify step: Docker actions
        # pull a container image at runtime which requires outbound access to
        # container registries (ghcr.io / docker.io). Those registries are NOT
        # in the harden-runner allowlist (egress-policy: block), so the Docker
        # approach would silently fail once runner hardening is enforced.
        #
        # Runs AFTER:
        #   • prebuild generation (so generated pages are minified too)
        #   • optimize-css (purge first → minify already-smaller CSS)
        #   • CSP / Mermaid cache-bust normalisation
        # Runs BEFORE:
        #   • rm -rf node_modules (devDeps still available)
        #   • AWS sync passes (S3 receives the minified payload)
        run: npm run minify-assets

      - name: Cleanup node_modules pre-deploy
        run: |
          rm -rf node_modules
          echo "✅ Removed node_modules (excluded from S3 sync regardless, removed for cleanliness)"

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::172017021075:role/GithubWorkFlowRole
          role-session-name: githubworkflowrolesessiont2
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 with cache headers
        run: |
          BUCKET="s3://${{ env.S3_BUCKET_NAME }}"
          SRC="."

          # Common exclusions for non-website directories/files (bash array)
          EXCL=(
            --exclude "screenshots/*"
            --exclude ".git/*"
            --exclude "scripts/*"
            --exclude "test/*"
            --exclude "e2e/*"
            --exclude "src/*"
            --exclude ".github/*"
            --exclude ".devcontainer/*"
            --exclude "node_modules/*"
            --exclude "quicksight/*"
            --exclude "schemas/*"
            --exclude "builds/*"
            --exclude "runbooks/*"
            --exclude "analysis/*"
            --exclude "*.md"
            --exclude "package*.json"
            --exclude ".gitignore"
            --exclude ".gitattributes"
            --exclude "tsconfig*.json"
            --exclude "typedoc.json"
            --exclude "jsdoc.json"
            --exclude "knip.json"
            --exclude "*.config.js"
            --exclude ".eslintcache"
            --exclude ".prettierrc.json"
            --exclude ".prettierignore"
            --exclude ".npmignore"
            --exclude ".lintstagedrc.json"
            --exclude ".jscpd.json"
            --exclude ".htmlhintignore"
            --exclude ".lighthouserc.json"
            --exclude ".lighthouserc.json.license"
            --exclude "*.patch"
            --exclude "*.lock"
            --exclude "*.tgz"
            --exclude "vitest.config.js"
            --exclude "playwright.config.js"
            --exclude "eslint.config.js"
            --exclude "tool-schemas.json"
            --exclude "*.template"
          )

          # ─── Pass 1: HTML files (short cache, ~1hr) ───────────────────────
          # --checksum-algorithm SHA256 instead of --size-only: HTML files are not
          # fingerprinted and small edits often don't change file size, so we need
          # content comparison to avoid serving stale pages after CloudFront invalidation.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=3600, must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 1/12: HTML files synced"

          # ─── Pass 2: Static assets except raster images (long cache) ───────
          # --size-only is safe here: all assets are fingerprinted (vendor chunks
          # have content-hashed names, JS/CSS via mermaid cache-bust query param).
          # A size change always means a new asset file, so --size-only is correct.
          aws s3 sync "$SRC" "$BUCKET" \
            --size-only \
            --no-progress \
            --exclude '*' \
             --include '*.css' \
             --include '*.js' --include '*.mjs' \
             --include '*.js.map' --include '*.mjs.map' \
             --include '*.svg' \
             --include '*.woff' --include '*.woff2' --include '*.ttf' --include '*.eot' --include '*.otf' \
             --cache-control 'public, max-age=31536000, immutable' \
             "${EXCL[@]}"
          echo "✅ Pass 2/12: Static assets synced"

          # ─── Pass 3–8: Raster images with explicit content types ───────────
          # Keep image formats in separate sync passes because `aws s3 sync`
          # applies one --content-type value to every included object when
          # --no-guess-mime-type is enabled.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.avif' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/avif' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 3/12: AVIF images synced"

          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.webp' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/webp' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 4/12: WebP images synced"

          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.png' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/png' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 5/12: PNG images synced"

          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.jpg' --include '*.jpeg' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/jpeg' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 6/12: JPEG images synced"

          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.gif' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/gif' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 7/12: GIF images synced"

          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.ico' \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'image/x-icon' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 8/12: ICO images synced"

          # ─── Pass 9: JSON metadata (medium cache, ~24hr) ──────────────────
          # --checksum-algorithm SHA256 for correctness — articles-metadata.json and
          # build-info.json are regenerated every deploy; content may change without
          # size change.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.json' \
            --cache-control 'public, max-age=86400' \
            --content-type 'application/json; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 9/12: JSON metadata synced"

          # ─── Pass 10: XML sitemaps/RSS (medium cache, ~24hr) ───────────────
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.xml' \
            --cache-control 'public, max-age=86400' \
            --content-type 'text/xml; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 10/12: XML sitemaps synced"

          # ─── Pass 11: Plain text files (medium cache, ~24hr) ───────────────
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' \
            --include '*.txt' --include '.nojekyll' \
            --cache-control 'public, max-age=86400' \
            --content-type 'text/plain; charset=utf-8' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 11/12: Text files synced"

          # ─── Pass 12: Web app manifest (medium cache, ~24hr) ───────────────
          # Separate pass to serve correct application/manifest+json content-type
          # required for PWA install prompts and browser manifest parsing.
          aws s3 sync "$SRC" "$BUCKET" \
            --checksum-algorithm SHA256 \
            --no-progress \
            --exclude '*' --include '*.webmanifest' \
            --cache-control 'public, max-age=86400' \
            --content-type 'application/manifest+json' \
            --no-guess-mime-type \
            "${EXCL[@]}"
          echo "✅ Pass 12/12: Web manifest synced"

          echo "✅ Deploy completed (12 sync passes)"
      
      # Invalidate CloudFront cache to ensure latest content is served
      # Note: Using blanket "/*" invalidation is optimal for this use case:
      # - Site has ~500 files (well within 1000 free invalidations/month)
      # - Deployment frequency is low (PR-based, not continuous)
      # - Simplicity trumps optimization at this scale
      # - Cache headers already optimized (1hr HTML, 1yr assets, 24hr metadata)
      - name: Invalidate CloudFront
        run: |
          echo "🔍 Discovering CloudFront distribution ID from stack: ${{ env.CLOUDFRONT_STACK_NAME }}"
          CloudFrontDistId=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CLOUDFRONT_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$CloudFrontDistId" ]; then
            echo "⚠️  Warning: CloudFront distribution ID not found in stack outputs"
            echo "Attempting to find distribution by S3 origin domain..."
            # List all distributions and filter by S3 bucket origin
            CloudFrontDistId=$(aws cloudfront list-distributions \
              --output json 2>/dev/null | \
              jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${{ env.S3_BUCKET_NAME }}\")) | .Id" | \
              head -n 1 || echo "")
          fi
          
          if [ -z "$CloudFrontDistId" ] || [ "$CloudFrontDistId" = "None" ]; then
            echo "❌ Error: Could not discover CloudFront distribution ID"
            exit 1
          fi
          
          echo "✅ Found CloudFront distribution: $CloudFrontDistId"
          echo "🔄 Creating cache invalidation for all paths..."
          
          aws cloudfront create-invalidation \
            --distribution-id $CloudFrontDistId \
            --paths "/*"
          
          echo "✅ CloudFront cache invalidation completed"
