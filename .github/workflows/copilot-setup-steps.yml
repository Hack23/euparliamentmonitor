name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  GITHUB_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN }}
  DISPLAY: ":99"
  EP_REQUEST_TIMEOUT_MS: "180000"
  IMF_API_TIMEOUT_MS: "180000"
  # IMF Data Portal Azure-APIM subscription keys (mandatory since the
  # September 2025 migration). Surfaced here so cloud-agent debugging
  # bash sessions can hit `api.imf.org/external/sdmx/3.0/` directly.
  # The agentic news workflows read these via `shared/mcp/news-mcp-servers.md`.
  IMF_API_PRIMARY_KEY: ${{ secrets.IMF_API_PRIMARY_KEY }}
  IMF_API_SECONDARY_KEY: ${{ secrets.IMF_API_SECONDARY_KEY }}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    # Explicit job cap (default is 360 min). Setup includes MCP server
    # install + Playwright browsers; <20 min typical. 30 min bounds runaway
    # npm/playwright download retries.
    timeout-minutes: 30

    # Permissions required for the Copilot coding agent to operate.
    # contents: write — agent must create branches and push commits
    # pull-requests: write — agent must open and update pull requests
    # issues: write — agent must post progress comments on issues
    # All other permissions kept at minimum required for setup steps.
    permissions:
      contents: write
      actions: read
      attestations: read
      checks: read
      deployments: read
      issues: write
      models: read
      discussions: read
      pages: read
      pull-requests: write
      security-events: read
      statuses: read

    # Steps run before the agent starts working
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Setup environment
      - name: Setup Environment (with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          echo "🔧 Setting up environment..."

          # Install system dependencies — retry loop to survive mirror outages
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates curl python3; then
              echo "✅ apt packages installed on attempt $attempt"
              break
            fi
            echo "⚠️ apt install failed on attempt $attempt — retrying in 20s"
            sleep 20
            if [ $attempt -eq 3 ]; then
              echo "❌ apt install failed after 3 attempts"
              exit 1
            fi
          done

      # JavaScript/TypeScript setup
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install gh-aw CLI
        run: |
          GH_AW_VERSION="v0.81.4"
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      # Pre-install MCP server packages globally
      - name: Install MCP server packages globally
        timeout-minutes: 15
        shell: bash
        run: |
          echo "📦 Installing MCP server packages globally..."

          # Helper — install a global npm package with up to 3 retries
          npm_install_global() {
            local pkg="$1"
            for attempt in 1 2 3; do
              if npm install -g --prefer-offline "$pkg"; then
                echo "✅ Installed $pkg on attempt $attempt"
                return 0
              fi
              echo "⚠️ npm install -g $pkg failed on attempt $attempt — retrying in 15s"
              sleep 15
            done
            echo "❌ npm install -g $pkg failed after 3 attempts"
            return 1
          }

          npm_install_global @modelcontextprotocol/server-filesystem
          npm_install_global @modelcontextprotocol/server-memory
          npm_install_global @modelcontextprotocol/server-sequential-thinking

          # Pre-cache @playwright/mcp for faster startup
          npm_install_global @playwright/mcp

          # Install World Bank MCP server for economic data
          npm_install_global worldbank-mcp@1.0.1

          # Install European Parliament MCP Server for parliamentary data access
          # Clear any stale npx cache to prevent version mismatch
          npx_cache_dir=$(npm config get cache)/_npx
          if [ -d "$npx_cache_dir" ]; then
            echo "🧹 Clearing npx cache to prevent stale EP MCP server versions..."
            find "$npx_cache_dir" -path "*/european-parliament-mcp-server*" -type d -exec rm -rf {} + 2>/dev/null || true
          fi
          npm_install_global european-parliament-mcp-server@1.3.20

          # Verify the installed version matches expected
          EP_VERSION=$(european-parliament-mcp-server --version 2>/dev/null || echo "unknown")
          echo "📍 Installed EP MCP Server version: $EP_VERSION"
          if [ "$EP_VERSION" != "1.3.20" ]; then
            echo "⚠️ Warning: Expected version 1.3.20 but got $EP_VERSION"
          fi

          echo "✅ Node.js MCP server packages installed globally"

      # Verify all MCP server installations
      - name: Verify MCP server installations
        run: |
          echo "🔍 Verifying MCP server installations..."
          
          echo "=== Node.js MCP Servers ==="
          echo "Checking mcp-server-filesystem..."
          which mcp-server-filesystem && echo "✅ mcp-server-filesystem found" || echo "❌ mcp-server-filesystem NOT found"
          
          echo "Checking mcp-server-memory..."
          which mcp-server-memory && echo "✅ mcp-server-memory found" || echo "❌ mcp-server-memory NOT found"
          
          echo "Checking mcp-server-sequential-thinking..."
          which mcp-server-sequential-thinking && echo "✅ mcp-server-sequential-thinking found" || echo "❌ mcp-server-sequential-thinking NOT found"
          
          echo "Checking @playwright/mcp..."
          which mcp-server-playwright 2>/dev/null && echo "✅ mcp-server-playwright found" || echo "ℹ️ @playwright/mcp available via npx"
          
          echo "Checking european-parliament-mcp-server..."
          which european-parliament-mcp-server 2>/dev/null && echo "✅ european-parliament-mcp-server found" || echo "❌ european-parliament-mcp-server NOT found"
          
          echo "Checking worldbank-mcp..."
          which worldbank-mcp 2>/dev/null && echo "✅ worldbank-mcp found" || echo "❌ worldbank-mcp NOT found"
                              
          echo ""
          echo "=== HTTP MCP Servers ==="
          echo "📍 GitHub MCP Server: Using HTTP endpoint (https://api.githubcopilot.com/mcp/insiders)"
          echo "✅ MCP server verification complete"
