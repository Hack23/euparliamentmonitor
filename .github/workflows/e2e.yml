name: E2E Tests

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        # Only Chromium is active in playwright.config.js; --with-deps installs
        # the OS-level libraries (libglib2, libnss3, etc.) that Chromium needs.
        # This replaces the previous mcr.microsoft.com/playwright container-job
        # approach, which was fragile against MCR CDN pull blocks.
        run: npx playwright install --with-deps chromium

      - name: Generate test content
        run: |
          npm run prebuild
          npm run generate-news-indexes

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: builds/playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: builds/test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: builds/test-results/**/*.png
          retention-days: 7

      - name: Upload videos
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-videos
          path: builds/test-results/**/*.webm
          retention-days: 7
