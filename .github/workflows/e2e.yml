name: E2E Tests

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline; then
              echo "✅ npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ npm ci failed on attempt $attempt — retrying in 15s"
            sleep 15
          done
          echo "❌ npm ci failed after 3 attempts"
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-all-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-v2-all-

      - name: Install Playwright OS dependencies (with retry)
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install-deps; then
              echo "✅ Playwright OS deps installed on attempt $attempt"
              exit 0
            fi
            echo "⚠️ playwright install-deps failed on attempt $attempt — retrying in 20s"
            sleep 20
          done
          echo "❌ playwright install-deps failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers (with retry)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install; then
              echo "✅ Playwright browsers installed on attempt $attempt"
              exit 0
            fi
            echo "⚠️ playwright install failed on attempt $attempt — retrying in 20s"
            sleep 20
          done
          echo "❌ playwright install failed after 3 attempts"
          exit 1

      - name: Generate test content
        run: |
          npm run prebuild
          npm run generate-news-indexes

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: builds/playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: builds/test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: builds/test-results/**/*.png
          retention-days: 7

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-videos
          path: builds/test-results/**/*.webm
          retention-days: 7
