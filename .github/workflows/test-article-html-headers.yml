name: Preview Executive Brief SEO

# Read-only audit workflow that previews the SEO <head> metadata
# (title, description, keywords, og:*, twitter:*) that the article
# generator would produce from each executive brief — without generating
# any news/*.html files.
#
# Source: executive-brief.md (and translated siblings) under
# analysis/daily/*/. The same resolver chain used by
# `npm run generate-article:all` is invoked via scripts/dump-article-seo.js,
# so the preview is bit-for-bit identical to what would be written into the
# final HTML <head>.
#
# Use this workflow to audit and improve SEO titles, descriptions, and
# keywords before committing to a full HTML generation run.
#
# Pairs with the aggregator pipeline documented in Article-Generation.md.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional cap on number of runs to preview (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview-seo:
    name: Preview SEO from executive briefs
    runs-on: ubuntu-26.04
    # English-only preview of ~220 runs completes well under 5 min on a
    # clean runner; 15 min bounds runaway while leaving headroom for growth.
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript aggregator
        # The dumper imports compiled artifacts under scripts/aggregator/**.
        # These are checked in, but recompiling guarantees the preview
        # reflects the latest src/aggregator/* on the branch being tested.
        run: npm run build

      - name: Preview English SEO from executive briefs (all analysis runs)
        run: |
          mkdir -p builds/seo-dump
          LIMIT_ARG=""
          LIMIT_INPUT="${{ inputs.limit }}"
          if [ -n "$LIMIT_INPUT" ]; then
            if ! printf '%s' "$LIMIT_INPUT" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::--limit must be a positive integer (>0), got: $LIMIT_INPUT"
              exit 1
            fi
            LIMIT_ARG="--limit $LIMIT_INPUT"
          fi
          npm run dump:article-seo -- \
            --lang en \
            --out builds/seo-dump/brief-seo-preview-en.txt \
            --json builds/seo-dump/brief-seo-preview-en.jsonl \
            $LIMIT_ARG

      - name: Print summary to job log
        run: |
          echo "## Executive Brief SEO Preview — summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 builds/seo-dump/brief-seo-preview-en.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate resolved article SEO (hard gate)
        # Hard CI gate covering the Stage-D contract: empty title/description,
        # CJK-weighted length budgets, trailing-ellipsis truncation, reserved
        # Stage-B prefixes, leaky run-ids / "analysis run" jargon, and the
        # composeContextualTitle uniqueness contract for same-(date,
        # articleType) republishes. Pairs with validate:manifest-seo which
        # audits the Stage-B input contract.
        run: npm run validate:seo -- --report builds/seo-dump/validate-article-seo.json

      - name: Upload SEO preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brief-seo-preview-en
          path: builds/seo-dump/
          if-no-files-found: error
          retention-days: 30
