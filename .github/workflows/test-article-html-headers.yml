name: Test Article HTML Headers

# Read-only audit workflow that dumps the HTML <title>, <meta description>,
# <meta description-extended>, and <meta keywords> values produced by the
# deterministic article generator for every committed analysis run.
#
# Uses the *same code path* as `npm run generate-article:all` — specifically
# the resolveArticleMetadata() resolver in src/aggregator/article-metadata.ts
# wired up via scripts/dump-article-seo.js. No HTML is rendered, no files in
# news/ or analysis/ are touched; the dump is uploaded as a build artifact so
# the bad current SEO state of titles/descriptions/keywords on
# https://euparliamentmonitor.com/ can be reviewed without re-running the
# full 14-language renderer.
#
# Pairs with the aggregator pipeline documented in Article-Generation.md and
# mirrors the trigger / runner / setup steps of regenerate-articles.yml.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional cap on number of runs to dump (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dump-headers:
    name: Dump article HTML <head> metadata (English)
    runs-on: ubuntu-latest
    # English-only dump of ~220 runs completes well under 5 min on a clean
    # runner; 15 min bounds runaway while leaving headroom for repo growth.
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript aggregator
        # The dumper imports compiled artifacts under scripts/aggregator/**.
        # These are checked in, but recompiling guarantees the audit reflects
        # the latest src/aggregator/* on the branch being tested.
        run: npm run build

      - name: Dump English HTML head metadata for every analysis run
        run: |
          mkdir -p builds/seo-dump
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
          fi
          npm run dump:article-seo -- \
            --lang en \
            --out builds/seo-dump/article-headers-en.txt \
            --json builds/seo-dump/article-headers-en.jsonl \
            $LIMIT_ARG

      - name: Print dump summary to job log
        run: |
          echo "## Article HTML head dump — summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 builds/seo-dump/article-headers-en.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SEO header dump
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-html-headers-en
          path: builds/seo-dump/
          if-no-files-found: error
          retention-days: 30
