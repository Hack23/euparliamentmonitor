      - name: Upload cache-memory data as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.validate_cache_memory_64656661756c74.outcome == 'success'
        with:
