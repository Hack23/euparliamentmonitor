name: Compile Agentic Workflows

# Compile .md workflow files to .lock.yml and commit all generated artifacts.
# News workflows import modules from .github/prompts/ (see that dir's README).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  compile:
    name: Compile Agentic Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .github/workflows/compile-agentic-workflows.yml

      - name: Install gh-aw CLI
        run: |
          GH_AW_VERSION="v0.74.7"
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Delete existing lock files
        run: find .github/workflows -name "*.lock.yml" -type f -delete

      - name: Compile all workflows
        run: gh aw compile
        env:
          GH_TOKEN: ${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Patch safe_outputs fetch-depth for bundle compatibility
        # The gh-aw compiler emits fetch-depth: 1 on BOTH safe_outputs Checkout steps:
        #   (a) the comment-event path (ref: default_branch), and
        #   (b) the main path (ref: extract-base-branch.outputs.base-branch || …),
        #     which is the one used by workflow_dispatch and schedule triggers.
        # Two failure modes — both fixed by switching to fetch-depth: 0:
        #   1. Bundle-apply detects a shallow clone (depth=1) and runs
        #      `git fetch --unshallow origin` mid-job. On this repo it takes 13+ min
        #      and trips the 15-min safe_outputs job timeout (see run #26151926742).
        #   2. When main advances during the agent run, depth=1 loses the
        #      prerequisite commit the bundle was created from, causing
        #      "Repository lacks these prerequisite commits" and a failed
        #      create_pull_request safe output.
        # The pattern uniquely targets the safe_outputs checkouts: they have
        # `persist-credentials: false` immediately before `fetch-depth: 1`. The
        # agent checkout has `sparse-checkout-cone-mode: true` before its
        # `fetch-depth: 1`, so it is intentionally NOT patched (agent uses sparse
        # checkout and does not apply bundles).
        # NOTE: no replacement count is passed — both occurrences must be patched.
        # An earlier version used `replace(..., 1)` which left the main-path
        # checkout (occurrence #2) untouched and broke every workflow_dispatch /
        # scheduled news run.
        run: |
          python3 - << 'PYEOF'
          import glob
          PATTERN     = '          persist-credentials: false\n          fetch-depth: 1'
          REPLACEMENT = '          persist-credentials: false\n          fetch-depth: 0'
          files = glob.glob('.github/workflows/news-*.lock.yml')
          exit_code = 0
          for f in sorted(files):
              with open(f) as fp:
                  content = fp.read()
              count = content.count(PATTERN)
              if count == 0:
                  print(f'WARN: pattern not found in {f}')
                  continue
              # Each news lock file MUST have exactly 2 safe_outputs checkouts.
              if count != 2:
                  print(f'ERROR: {f} has {count} occurrences of safe_outputs Checkout pattern (expected 2)')
                  exit_code = 1
                  continue
              with open(f, 'w') as fp:
                  fp.write(content.replace(PATTERN, REPLACEMENT))
              print(f'Patched {f} ({count} occurrences)')
          if exit_code:
              raise SystemExit(exit_code)
          PYEOF

      - name: Enforce prompt-module architecture
        run: |
          set -e
          # news-translate.md is the sole legitimate exemption from the
          # body-line and single-PR caps. It implements a scheduled multi-call
          # flush translator (see scripts/lint-prompts.js EXEMPT_FROM_*),
          # not the standard article pipeline. All other news workflows
          # MUST stay within the single-PR / 200-body-line contract.
          EXEMPT_NEWS="news-translate.md"
          echo "🔍 Checking .github/prompts/ module line caps (≤ 550)…"
          FAIL=0
          for f in .github/prompts/*.md .github/prompts/ext/*.md; do
            [ -f "$f" ] || continue
            LINES=$(wc -l < "$f")
            if [ "$LINES" -gt 550 ]; then
              echo "  ❌ $f has $LINES lines (> 550)"
              FAIL=1
            else
              echo "  ✅ $f ($LINES lines)"
            fi
          done
          echo ""
          echo "🔍 Checking .github/workflows/news-*.md body line caps (≤ 200 excluding frontmatter, news-translate.md exempt)…"
          for f in .github/workflows/news-*.md; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" = "$EXEMPT_NEWS" ]; then
              echo "  ⏭️  $f (exempt: multi-call flush translator)"
              continue
            fi
            # Body = content after the second "^---$" line
            BODY_LINES=$(awk 'BEGIN{c=0;out=0} /^---$/{c++;if(c==2){out=1;next}} out==1{print}' "$f" | wc -l)
            if [ "$BODY_LINES" -gt 200 ]; then
              echo "  ❌ $f has body of $BODY_LINES lines (> 200)"
              FAIL=1
            else
              echo "  ✅ $f (body $BODY_LINES lines)"
            fi
          done
          echo ""
          echo "🔍 Enforcing safe-outputs.create-pull-request.max: 1 on all news workflows (source .md, news-translate.md exempt)…"
          for f in .github/workflows/news-*.md; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" = "$EXEMPT_NEWS" ]; then
              echo "  ⏭️  $f (exempt: multi-call flush translator uses max: 10)"
              continue
            fi
            # Extract max value directly under create-pull-request block
            MAX=$(awk '
              /^  create-pull-request:/ {in_block=1; next}
              in_block && /^  [a-zA-Z]/ {in_block=0}
              in_block && /^    max:/ {print $2; exit}
            ' "$f")
            if [ -z "$MAX" ]; then
              echo "  ❌ $f has no explicit create-pull-request.max (must be 1; default may change upstream)"
              FAIL=1
            elif [ "$MAX" != "1" ]; then
              echo "  ❌ $f has create-pull-request.max: $MAX (must be 1)"
              FAIL=1
            else
              echo "  ✅ $f (max: 1)"
            fi
          done
          echo ""
          echo "🔍 Enforcing create_pull_request.max: 1 on compiled .lock.yml (safe-outputs config, news-translate exempt)…"
          # The safe-outputs config appears in two places in each compiled lock:
          #   (a) a plain-JSON block embedded in a prompt heredoc:
          #         "create_pull_request":{...,"max":N,...}
          #   (b) the runtime env var GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG, a
          #       YAML-quoted JSON string with backslash-escaped quotes:
          #         \"create_pull_request\":{...,\"max\":N,...}
          # Both forms can contain `}` characters INSIDE string values (e.g.
          # the `${COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN}` env reference),
          # which broke the previous `[^}]*` grep regex. Use Python with a
          # non-greedy regex anchored on the first `"max":N` after the
          # `"create_pull_request":{` opener — and exempt news-translate.lock.yml,
          # which legitimately encodes max: 10.
          if ! python3 - <<'PYEOF'
          import glob, re, sys
          EXEMPT = {'news-translate.lock.yml'}
          PATTERN = re.compile(r'"create_pull_request"\s*:\s*\{.*?"max"\s*:\s*(\d+)', re.DOTALL)
          fail = 0
          for lf in sorted(glob.glob('.github/workflows/news-*.lock.yml')):
              base = lf.rsplit('/', 1)[-1]
              if base in EXEMPT:
                  print(f'  ⏭️  {lf} (exempt: multi-call flush translator uses max: 10)')
                  continue
              with open(lf, encoding='utf-8') as fp:
                  text = fp.read()
              # Strip backslashes so the YAML-escaped JSON form matches the
              # same regex as the plain JSON form.
              norm = text.replace('\\', '')
              matches = PATTERN.findall(norm)
              if not matches:
                  print(f'  ❌ {lf} has no create_pull_request config with max (plain or backslash-escaped JSON)')
                  fail = 1
                  continue
              bad = [m for m in matches if m != '1']
              if bad:
                  print(f'  ❌ {lf} has create_pull_request.max != 1 (found: {" ".join(matches)})')
                  fail = 1
              else:
                  print(f'  ✅ {lf} (create_pull_request.max: 1, {len(matches)} occurrence(s))')
          sys.exit(fail)
          PYEOF
          then
            FAIL=1
          fi
          echo ""
          echo "🔍 Scanning for banned multi-PR / heartbeat / keep-alive strings…"
          BANNED='Heartbeat|keep-alive pinger|post-heartbeat rebase|🫀'
          if grep -rInE "$BANNED" .github/workflows/news-*.md .github/prompts/ 2>/dev/null; then
            echo "  ❌ banned strings present"
            FAIL=1
          else
            echo "  ✅ no banned strings"
          fi
          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ Prompt-module architecture check failed."
            exit 1
          fi
          echo "✅ Prompt-module architecture checks passed."

      - name: Commit all generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml \
                  .github/workflows/agentics-maintenance.yml \
                  .github/aw/actions-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git diff --cached --stat
            git commit -m "chore: recompile agentic workflow lock files"
            git push
          fi
